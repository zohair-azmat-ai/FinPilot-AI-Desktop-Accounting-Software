[package]
name = "finpilot-ai"
version = "1.0.0"
description = "FinPilot AI — UAE Accounting Software"
authors = ["FinPilot"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.7", features = [
    "shell-open",
    "path-all",
    "window-maximize",
    "window-minimize",
    "window-close",
] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# and the built-in dev server is bypassed. DO NOT remove.
custom-protocol = ["tauri/custom-protocol"]
